<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f1621" />
  <title>Alfred</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sono:wght@200..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1621;
      --card: #161f2e;
      --card-hover: #1b2536;
      --line: #2b3a52;
      --ink: #e8eef6;
      --muted: #9fb0c4;
      --accent: #3aa0ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    header { padding: 96px 0 20px; }
    h1 {
      font-family: 'Sono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 300;
      font-size: clamp(38px, 7.5vw, 68px);
      line-height: 1.08;
      letter-spacing: 0.02em;
      margin: 0 0 22px;
    }
    .profile {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--accent); text-decoration: none;
      font-size: 17px; font-weight: 500;
    }
    .profile:hover { text-decoration: underline; }
    .profile svg { width: 19px; height: 19px; fill: currentColor; }
    .links { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }

    .intro {
      margin: 28px 0 0;
      font-size: 17px;
      color: var(--muted);
      max-width: 52ch;
    }

    main { padding: 0 0 96px; }
    .section-label {
      font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
      color: var(--muted); font-weight: 600;
      margin: 22px 0 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line);
    }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px 24px;
      transition: transform .15s ease, background .15s ease, border-color .15s ease;
    }
    a.card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: #3d5170;
    }
    .card-body { display: flex; align-items: center; gap: 22px; }
    .card-text { flex: 1; min-width: 0; }
    .card h2 {
      font-family: 'Sono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 400; letter-spacing: 0.01em;
      font-size: 23px; margin: 0;
    }
    .card p { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .thumb {
      width: 176px; height: auto; flex-shrink: 0;
      border-radius: 9px; border: 1px solid var(--line);
      display: block;
    }
    @media (max-width: 620px) {
      header { padding: 44px 0 20px; }
      .card-body { flex-direction: column; align-items: stretch; gap: 18px; }
      .thumb { width: 100%; order: 2; }
      .card-text { order: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Alfred Strabel</h1>
      <div class="links">
        <a class="profile" href="https://www.linkedin.com/in/alfredstrabel/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>
          LinkedIn
        </a>
        <a class="profile" href="https://github.com/fredibeni/alfreds.me" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
          GitHub
        </a>
      </div>
      <p class="intro">Hi, I'm Alfred. This is a site for my vibe-coding projects.</p>
    </header>

    <main>
      <div class="section-label">Projects</div>
      <a class="card" href="/best-place/">
        <div class="card-body">
          <div class="card-text">
            <h2>Best Place</h2>
            <p>Find where to live: filter world cities by tax, cost of living, climate, etc.</p>
          </div>
          <img class="thumb" src="/best-place-thumb.jpg" width="420" height="210" loading="lazy" alt="World map showing the cities covered by Best Place" />
        </div>
      </a>
    </main>
  </div>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
